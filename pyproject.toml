[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvr-mev"
version = "0.1.0"
description = "The true cost of providing liquidity: LVR, MEV and the net return to Uniswap v3 market making"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "network: hits a live RPC or public data endpoint",
    "gate: a stage gate — a failure means stop, not proceed",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
