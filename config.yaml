# =============================================================================
# LVR/MEV — central configuration
#
# Every number that changes a table lives here, not in code.
# Annualisation convention is stated ONCE, here, and imported everywhere.
# =============================================================================

project:
  name: lvr-mev
  seed: 42                      # fixed seed, all stochastic paths
  sample_start: "2023-01-01"
  sample_end:   "2025-12-31"
  chain: ethereum               # mainnet only — L2 explicitly out of scope

# -----------------------------------------------------------------------------
# Annualisation — stated once, imported, never re-derived inline.
# -----------------------------------------------------------------------------
annualisation:
  days_per_year: 365            # crypto trades continuously; no 252
  hours_per_day: 24
  seconds_per_year: 31536000    # 365 * 24 * 3600
  block_seconds: 12             # post-Merge nominal slot time
  convention_note: >
    All returns and rates are simple (not log), annualised by scaling to
    365 calendar days. Volatility is annualised as sigma_period * sqrt(periods
    per year). Any table deviating from this must say so in its caption.

# -----------------------------------------------------------------------------
# Universe. Core first. Do not touch the extension until core passes all gates.
# Addresses verified against the chain itself by scripts/verify_pools.py
# (token0, token1, fee, tickSpacing and both decimals read from the pool and
# ERC-20 contracts). All 5 pools PASS as of 2026-09-05. Re-run after any edit.
# token0/token1 is ADDRESS-SORTED, not semantic — verified per pool.
# -----------------------------------------------------------------------------
universe:
  core:
    - id: ETH_USDC_5bp
      address: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"
      token0: {symbol: USDC, decimals: 6,  address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"}
      token1: {symbol: WETH, decimals: 18, address: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"}
      fee_tier_bps: 5
      tick_spacing: 10
      invert_price: true        # price is token1/token0 = WETH/USDC -> invert for USD per ETH
      cex_symbol: ETHUSDT       # pool price is USD per ETH; ETHUSDT is too
      cex_invert: false
      verified_on_etherscan: true
    - id: ETH_USDC_30bp
      address: "0x8ad599c3a0ff1de082011efddc58f1908eb6e6d8"
      token0: {symbol: USDC, decimals: 6,  address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"}
      token1: {symbol: WETH, decimals: 18, address: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"}
      fee_tier_bps: 30
      tick_spacing: 60
      invert_price: true
      cex_symbol: ETHUSDT
      cex_invert: false
      verified_on_etherscan: true
    - id: ETH_USDC_100bp
      address: "0x7bea39867e4169dbe237d55c8242a8f2fcdcc387"
      token0: {symbol: USDC, decimals: 6,  address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"}
      token1: {symbol: WETH, decimals: 18, address: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"}
      fee_tier_bps: 100
      tick_spacing: 200
      invert_price: true
      cex_symbol: ETHUSDT
      cex_invert: false
      verified_on_etherscan: true
  extension:                    # ONLY after core passes Stage 1-3 gates
    - id: WBTC_ETH_30bp
      address: "0xcbcdf9626bc03e24f779434178a73a0b4bad62ed"
      token0: {symbol: WBTC, decimals: 8,  address: "0x2260fac5e5542a773aa44fbcfedf7c193bc2c599"}
      token1: {symbol: WETH, decimals: 18, address: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"}
      fee_tier_bps: 30
      tick_spacing: 60
      invert_price: false
      # Pool price is WETH per WBTC (ETH per BTC). Binance ETHBTC quotes BTC per
      # ETH, so the reference is its reciprocal.
      cex_symbol: ETHBTC
      cex_invert: true
      verified_on_etherscan: true
    - id: USDC_USDT_1bp
      address: "0x3416cf6c708da44db2624d63ea0aaef7113527c6"
      token0: {symbol: USDC, decimals: 6,  address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"}
      token1: {symbol: USDT, decimals: 6,  address: "0xdac17f958d2ee523a2206206994597c13d831ec7"}
      fee_tier_bps: 1
      tick_spacing: 1
      invert_price: false
      cex_symbol: USDCUSDT      # pool price is USDT per USDC; so is USDCUSDT
      cex_invert: false
      verified_on_etherscan: true

# -----------------------------------------------------------------------------
# Position specification (Stage 0.2). Baseline + swept alternatives.
# -----------------------------------------------------------------------------
position:
  notional_usd: 100000
  range_half_width: 0.10        # +/-10% around entry price
  recentre_rule: on_range_exit  # never | on_range_exit | weekly
  cohort: monthly               # monthly (first of month) | rolling
  sweeps:
    range_half_width: [0.02, 0.05, 0.10, 0.25, 0.50]
    recentre_rule: [never, on_range_exit, weekly]
    notional_usd: [10000, 100000, 1000000, 10000000]   # capacity study (open Q4)

# -----------------------------------------------------------------------------
# Hedge specification (Stage 0.1). Delta-hedged is PRIMARY; raw is robustness.
# -----------------------------------------------------------------------------
hedge:
  variant: delta_hedged         # delta_hedged (primary) | raw
  instrument: binance_eth_perp  # binance_eth_perp | deribit_eth_perp
  rebalance_freq: 1h            # REVISED from 1D — see DECISIONS.md Q7
  rebalance_sweeps: ["1h", "1D", "7D"]
  taker_fee: 0.0004             # Binance USD-M taker
  hedge_ratio_source: v3_position_delta   # NOT 0.5 — from the v3 position formula
  funding: realised             # realised | assumed_zero (robustness only)

# -----------------------------------------------------------------------------
# CEX reference price and block alignment (Stage 1.3, open question 3)
# -----------------------------------------------------------------------------
cex:
  venue: binance
  symbol: ETHUSDT
  source: data.binance.vision
  granularity: trades           # trades | klines_1s
  alignment_rule: last_trade_at_or_before_block_ts   # NO forward-looking, ever
  alignment_sweeps:
    - last_trade_at_or_before_block_ts
    - last_trade_at_or_before_parent_block_ts
    - midpoint_interpolation_between_blocks

# -----------------------------------------------------------------------------
# LVR (Stage 3)
# -----------------------------------------------------------------------------
lvr:
  analytical_constant: 0.125    # sigma^2 / 8
  vol_estimator: rv_5min        # baseline
  vol_estimator_sweeps: [rv_1min, rv_5min, garman_klass, bipower]
  vol_window_hours: 24          # trailing
  sanity_bounds_annualised: [0.005, 0.60]   # outside this -> STOP, do not report

# -----------------------------------------------------------------------------
# MEV (Stage 4)
# -----------------------------------------------------------------------------
mev:
  primary_source: dune_classified     # dune_classified | own_classifier
  attribution_method: neutral         # revised — see DECISIONS.md 4.2
  report_with_and_without: true
  sandwich_matching:
    same_address: true
    bundle_level: false               # Flashbots public relay serves only recent
                                      # slots; empty for the sample period (4.3)
    reversal_tolerance: 0.10          # back leg must unwind the front leg
    max_leg_span: 24                  # legs bracket the victim, not the block
    require_positive_profit: true
    sweeps:
      reversal_tolerance: [0.02, 0.05, 0.10, 0.25, 0.50, 1.00]

# -----------------------------------------------------------------------------
# Fee accrual (Stage 2.2)
# -----------------------------------------------------------------------------
fees:
  approach: B                   # B = pool `liquidity` field on Swap; A = event replay
  validate_B_against_A: true
  validation_tolerance: 0.01    # 1% agreement over one week to keep B

# -----------------------------------------------------------------------------
# Forecasting (Stage 6)
# -----------------------------------------------------------------------------
model:
  target_horizon_days: 7
  purge_days: 7                 # = target horizon
  embargo_days: 7               # >= 1 week
  n_splits: 5
  oos_split_date: "2025-01-01"  # declared BEFORE results are looked at
  lightgbm:
    n_estimators: 500
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 30
    subsample: 0.8
    colsample_bytree: 0.8
  baseline: har_rv              # analytical arm of the H6 horse race

# -----------------------------------------------------------------------------
# Strategy (Stage 7)
# -----------------------------------------------------------------------------
strategy:
  rebalance_freq: 7D
  allocation_threshold: 0.0     # predicted_net > threshold -> PROVIDE
  weighting: proportional_to_predicted_net   # | equal_weight_among_qualifying
  benchmarks: [equal_weight_lp, hold_tokens, fifty_fifty_rebalanced, best_single_pool_ex_post]

# -----------------------------------------------------------------------------
# Stage gates — hard stops. A failed gate means diagnose, not proceed.
# -----------------------------------------------------------------------------
gates:
  stage1_price_reconstruction_tolerance: 0.001   # 0.1% vs external reference
  stage1_spot_check_blocks: 10
  stage2_fee_accrual_tolerance: 0.02             # 2% vs subgraph
  stage3_lvr_sign: positive
  stage6_lookahead_test: must_pass

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  outputs_figures: outputs/figures
  outputs_tables: outputs/tables
  specification_log: outputs/specification_log.csv
